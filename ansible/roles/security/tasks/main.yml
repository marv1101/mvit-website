- name: UFW installieren
  ansible.builtin.apt:
    name: ufw
    state: present

- name: UFW-Regeln
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
  loop:
    - { port: '22' }
    - { port: '80' }
    - { port: '443' }
    - { port: '443', proto: 'udp' }

- name: UFW aktivieren
  community.general.ufw:
    state: enabled
    policy: deny

- name: Fail2ban installieren
  ansible.builtin.apt:
    name:
      - fail2ban
    state: present

- name: Fail2ban aktivieren
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

- name: Logrotate für Docker-Logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/docker-containers
    content: |
      /var/lib/docker/containers/*/*.log {
          rotate 5
          daily
          maxsize 50M
          missingok
          notifempty
          compress
          copytruncate
      }
    mode: '0644'

- name: Zeitzone
  community.general.timezone:
    name: Europe/Berlin