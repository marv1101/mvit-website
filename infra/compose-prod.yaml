# ───────────────────────────────────────────────────────────────────────────
# MVIT-Website – Production Stack
# Reverse Proxy: Caddy (automatisches HTTPS via Let's Encrypt).
# Datenbank:     PostgreSQL 16
# Backend:       Node.js/Express + Drizzle (mvit-webV2-api)
# Frontend:      React/Bun (mvits-webV2)
# CMS:           Drupal 10
# ───────────────────────────────────────────────────────────────────────────
#
# Build-Modus (Erstdeploy / Änderungen am Code):
#   docker compose -f compose-prod.yaml build
#
# Pull-Modus (laufender Betrieb mit CI/CD erstellten Images):
#   docker compose -f compose-prod.yaml pull
#
# Start:
#   docker compose -f compose-prod.yaml up -d --wait
# ───────────────────────────────────────────────────────────────────────────

x-restart: &restart-policy
  restart: always

x-security: &security-hardening
  security_opt:
    - no-new-privileges:true
  read_only: false                 # App-Container schreiben teils ins FS – read_only ggf. später
  tmpfs:
    - /tmp

services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    <<: *restart-policy
    image: postgres:16
    container_name: postgres
    env_file:
      - ./.env
    volumes:
      - pg_volume:/var/lib/postgresql/data:rw
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    # Postgres-Image legt intern den `postgres`-User an;
    # `no-new-privileges` stört allerdings das initiale Permissions-Chmod.
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 120s
    networks:
      - project_network
    shm_size: "512mb"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ─── Backend API ───────────────────────────────────────────────────────────
  api:
    <<: [*restart-policy, *security-hardening]
    image: ghcr.io/marv1101/mvit-api:${TAG:-latest}
    build:
      context: ../mvit-webV2-api
      dockerfile: Dockerfile
    container_name: mvit-api
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - project_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const r=require('http').get('http://localhost:3000/api/health',x=>process.exit(x.statusCode<400?0:1));r.on('error',()=>process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    user: "node"

  # ─── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    <<: [*restart-policy, *security-hardening]
    image: ghcr.io/marv1101/mvit-frontend:${TAG:-latest}
    build:
      context: ../mvits-webV2/mvits-webV2
      dockerfile: Dockerfile
    container_name: mvit-frontend
    ports:
      - 3001:3001
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Öffentliche Browser-URLs (Bun inlinet BUN_PUBLIC_* zur Serve-Zeit).
      # Defaults = Prod-Domain; für Staging via .env überschreiben.
      - BUN_PUBLIC_API_BASE_URL=${BUN_PUBLIC_API_BASE_URL:-https://mphion.de/api}
      - BUN_PUBLIC_DRUPAL_BASE_URL=${BUN_PUBLIC_DRUPAL_BASE_URL:-https://mphion.de/drupal}
    depends_on:
      - api
    networks:
      - project_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      # Frontend antwortet 200 auf /
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ─── Drupal CMS ───────────────────────────────────────────────────────────
  drupal:
    <<: [*restart-policy, *security-hardening]
    build:
      context: ./drupal
      dockerfile: Dockerfile
    container_name: drupal
    ports:
      - 8081:80
    env_file:
      - ./.env
    volumes:
      - drupal_data:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - project_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  project_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: ma_bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  pg_volume:
    driver: local
  drupal_data:
    driver: local