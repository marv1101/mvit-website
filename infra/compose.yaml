services:

#Postgres as a Database
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - 4242:5432
    restart: unless-stopped
    env_file:
      - ./.env
      - ./.env.development.local
    volumes:
      - pg_volume:/var/lib/postgresql/data:z
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf:z
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:z
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_statement=none", "-c", "log_min_duration_statement=1000", "-c", "log_connections=on", "-c", "log_disconnections=on" ]
    healthcheck:
      test: [ "CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-postgres}" -h localhost || exit 1' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 120s
    networks:
      - project_network

  drupal:
    image: drupal:10.5.8-php8.3-apache-trixie
    ports:
      - 8081:80
    volumes:
      - drupal_data:/var/www/html
    restart: unless-stopped
    networks:
      - project_network

  # Backend API
  api:
    build:
      context: ../mvit-webV2-api
      dockerfile: Dockerfile
    container_name: mvit-api
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - project_network

  # Frontend Application
  frontend:
    build:
      context: ../mvits-webV2/mvits-webV2
      dockerfile: Dockerfile
    container_name: mvit-frontend
    environment:
      - NODE_ENV=production
      - PORT=3001
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - project_network

  # Certbot for SSL Certificates
  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"  # Renew certificates every 12 hours
    depends_on:
      - nginx
    networks:
      - project_network

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt:z
      - ./certbot/www:/var/www/certbot:z
      - ./nginx/99-autoreload.sh:/docker-entrypoint.d/99-autoreload.sh  # Script to autoreload Nginx when certs are renewed
    depends_on:
      - api
      - frontend
      - drupal
    restart: unless-stopped
    networks:
      - project_network

networks:
  project_network:
    driver: bridge

volumes:
  pg_volume:
    driver: local
  pgadmin_volume:
    driver: local
  drupal_data:
    driver: local


