services:
  postgres:
    image: postgres:16
    container_name: mvit-postgres-dev
    ports:
      - 4242:5432
    env_file:
      - ./.env
      - ./.env.development.local
    volumes:
      - pg_dev_volume:/var/lib/postgresql/data
      - ./postgres/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d postgres -h localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  drupal:
    build: ./drupal
    container_name: mvit-drupal-dev
    ports:
      - 8081:80
    volumes:
      - drupal_dev_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mvit-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@localhost
      PGADMIN_DEFAULT_PASSWORD: dev
    ports:
      - 5050:80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - postgres

volumes:
  pg_dev_volume:
  drupal_dev_data:
