    <link rel="icon" type="image/svg+xml" href="./favicon-zzbprhq3.svg" />
    <link rel="manifest" href="./site-985x9zwr.webmanifest" />
    <script>
      // Setzt die Theme-Klasse vor dem ersten Paint, um Flash of wrong theme zu vermeiden.
      // Muss vor dem Stylesheet und dem Modul-Bundle laufen.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem("theme"); } catch (e) {}
        var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = theme === "dark" || (!theme && systemDark) || theme === "system" && systemDark;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
    
    <title>mvit Solutions</title>
  <link rel="stylesheet" crossorigin href="./chunk-6bzxf8jp.css"><script type="module" crossorigin src="./chunk-qnber8fe.js"></script></head>

    <div id="root"></div>
    <script>
      // Shim für Vendor-Code, der `process.env.*` im Browser erwartet.
      // Muss vor dem Modul-Bundle laufen (Module sind deferred).
      window.process = window.process || { env: { NODE_ENV: "production" } };
      window.process.env = window.process.env || { NODE_ENV: "production" };
    </script>
